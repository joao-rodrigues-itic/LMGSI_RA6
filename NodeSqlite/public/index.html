<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node + SQLite3 (Artistes)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="card">
      <h1>Exemple bàsic: SQLite3 amb Node</h1>
      <p>Aquest exemple només treballa amb artistes.</p>
      <p>Si la base de dades està buida, es creen dos artistes inicials.</p>
    </section>

    <section class="card">
      <h2>1) Afegir artista</h2>
      <form id="artist-form">
        <div>
          <label for="artist-name">Nom de l'artista</label>
          <input id="artist-name" name="name" required />
        </div>
        <div>
          <label for="artist-name">Nacionalitat de l'artista</label>
          <input id="artist-nacionalitat" name="name" />
        </div>
        <div>
          <button type="submit">Desar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>2) Consultar artistes</h2>
      <p id="artist-output">Prem "Carregar artistes" per veure dades.</p>
      <div class="row">
        <button id="load-btn" type="button" class="btn-small">Carregar artistes</button>
      </div>
    </section>

    <!-- Section per eliminar un artista -->
    <section class="card">
      <h2>3) Deletar artista</h2>
      <form id="artist-form-del">
        <div>
          <label for="artist-name-del">Nom de l'artista</label>
          <input id="artist-name-del" name="name" required />
        </div>
        <div>
          <button type="submit">Delete</button>
        </div>
      </form>
    </section>

    <!-- Section per actualitzar un artista -->
    <section class="card">
      <h2>4) Actualitzar artista</h2>
      <form id="artist-form-update">
        <div>
          <label for="artist-name-update">Nom de l'artista</label>
          <input id="artist-name-update" name="name" required />
        </div>
        <div>
          <label for="artist-name-nou">Nom de l'artista (actualitzat)</label>
          <input id="artist-name-nou" name="name" required />
        </div>
        <div>
          <label for="artist-nacionalitat-nova">Nacionalitat de l'artista (actualitzada)</label>
          <input id="artist-nacionalitat-nova" name="name" required />
        </div>
        <div>
          <button type="submit">Actualitzar</button>
        </div>
      </form>
    </section>

    <!-------------------------------------------------------------------------------------------->

  </main>

  <script src="app.js"></script>
</body>
</html>
